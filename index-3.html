const fmtTime=t=>t?new Date(t).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}):'—';
const intPositive=v=>{if(v===''||v===null||!Number.isFinite(Number(v))||Number(v)<=0||!Number.isInteger(Number(v)))throw Error('יש להזין סכום חיובי ושלם');return Number(v)};
const intNonNegative=v=>{if(v===''||v===null||!Number.isFinite(Number(v))||Number(v)<0||!Number.isInteger(Number(v)))throw Error('יש להזין סכום שלם שאינו שלילי');return Number(v)};
const cleanCode=v=>String(v||'').trim().toUpperCase();
const groupPath=c=>c==='YAKIR'?'poker_v2':'groups/'+c;
const fallbackPass=(data,code,key)=>String(data?.[key]??(code==='YAKIR'?'1946':''));
const validCode=c=>/^[A-Z0-9]{2,32}$/.test(c);
const defaults=p=>({...p,history:Array.isArray(p.history)?p.history:Object.values(p.history||{}),rebuyLog:Array.isArray(p.rebuyLog)?p.rebuyLog:Object.values(p.rebuyLog||{}),lifetime:num(p.lifetime),currentInv:num(p.currentInv),rebuys:num(p.rebuys),sessionBalance:num(p.sessionBalance)});
const normalizePlayers=raw=>(Array.isArray(raw)?raw:Object.values(raw||{})).filter(p=>p&&typeof p==='object').map(defaults);
function seatMap(players){const used=new Set();const result=new Map();for(const p of players.filter(p=>p.active)){if(Number.isInteger(p.seatIndex)&&p.seatIndex>=0&&p.seatIndex<10&&!used.has(p.seatIndex)){result.set(p.seatIndex,p);used.add(p.seatIndex)}}for(const p of players.filter(p=>p.active&&!Array.from(result.values()).includes(p))){const first=Array.from({length:10},(_,i)=>i).find(i=>!used.has(i));if(first!==undefined){p.seatIndex=first;result.set(first,p);used.add(first)}}return result}
function firstEmpty(players){const map=seatMap(players);for(let i=0;i<10;i++)if(!map.has(i))return i;return -1}
function idOf(p){return String(p.id)}
function getPlayer(id,people=state.players){return people.find(p=>idOf(p)===String(id))}
function cardsHtml(value){const s=String(value||'');const parts=[...s.matchAll(/(10|[2-9TJQKA])([hdsc])/gi)].slice(0,2).map(m=>({rank:m[1].toUpperCase(),suit:({h:'♥',d:'♦',s:'♠',c:'♣'})[m[2].toLowerCase()],red:/[hd]/i.test(m[2])}));while(parts.length<2)parts.push({rank:'?',suit:'♠',red:false});return '<span class="pair">'+parts.map(c=>`<span class="playing-card ${c.red?'red':''}"><span>${esc(c.rank)}</span><span>${c.suit}</span></span>`).join('')+'</span>'}
const state={code:null,admin:false,players:[],physicalCash:0,adminPassword:'',viewPassword:'',pendingSeat:null,currentPlayerId:null,movingId:null,modalKind:null,chart:null,sessionOffset:0,listener:null,dbRef:null,ready:false,processing:false,batchApplied:false};
let api,db;
function msg(text='',error=false){$('lobbyStatus').textContent=text;$('lobbyStatus').style.color=error?'#ff8993':'#c8c49a'}
function setSync(text,error=false){$('syncStatus').textContent=text;$('syncStatus').style.color=error?'#ff8993':'#91aea0'}
function requireAdmin(){if(!state.admin)throw Error('יש להתחבר כמנהל כדי לבצע פעולה זו')}
function updateAdminUI(){document.querySelectorAll('.admin-only').forEach(el=>el.classList.toggle('hidden',!state.admin));$('adminBtn').classList.toggle('hidden',state.admin);$('groupTitle').textContent=`📍 ${state.code} · ${state.admin?'מנהל 👑':'צופה 👁'}`}
function switchTab(name){for(const b of document.querySelectorAll('[data-tab]'))b.classList.toggle('active',b.dataset.tab===name);for(const pane of document.querySelectorAll('.pane'))pane.classList.toggle('active',pane.id==='pane-'+name)}
function showModal(title,body,kind){state.modalKind=kind;$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.remove('hidden')}
function closeModal(){state.modalKind=null;$('modal').classList.add('hidden');if(state.chart){state.chart.destroy();state.chart=null}}
async function enterGroup(code,pass,admin){if(state.listener)state.listener();state.code=code;state.admin=admin;sessionStorage.setItem('pokerGroup',code);sessionStorage.setItem('pokerPass',pass);state.dbRef=api.ref(db,groupPath(code));$('lobby').classList.add('hidden');$('app').classList.remove('hidden');updateAdminUI();setSync('מסנכרן מול Firebase…');state.listener=api.onValue(state.dbRef,snap=>{const data=snap.val()||{};state.players=normalizePlayers(data.players);state.physicalCash=num(data.physicalCash);state.adminPassword=fallbackPass(data,code,'adminPassword');state.viewPassword=fallbackPass(data,code,'viewPassword');render();setSync('מחובר ומסונכרן');if(!state.batchApplied)handleBatchFromUrl()},error=>{console.error(error);setSync('שגיאת סנכרון: '+error.message,true)})}
async function joinGroup(code,pass){if(!validCode(code))throw Error('קוד הקבוצה חייב להכיל 2–32 תווים באנגלית או מספרים');if(!pass)throw Error('נא להזין סיסמה');const snap=await api.get(api.ref(db,groupPath(code)));if(!snap.exists())throw Error('הקבוצה אינה קיימת');const data=snap.val(),ap=fallbackPass(data,code,'adminPassword'),vp=fallbackPass(data,code,'viewPassword');if(pass===ap)await enterGroup(code,pass,true);else if(vp&&pass===vp)await enterGroup(code,pass,false);else throw Error('סיסמה שגויה')}
async function createGroup(code,adminPass,viewPass){if(!validCode(code)||code==='YAKIR')throw Error('קוד חייב להיות 2–32 תווים באנגלית/מספרים, ולא YAKIR');if(adminPass.length<3||viewPass.length<3)throw Error('כל סיסמה צריכה להכיל לפחות 3 תווים');if(adminPass===viewPass)throw Error('סיסמת מנהל וצפייה חייבות להיות שונות');const group=api.ref(db,groupPath(code));const tx=await api.runTransaction(group,cur=>cur===null?{adminPassword:adminPass,viewPassword:viewPass,physicalCash:0,players:[]}:undefined,{applyLocally:false});if(!tx.committed)throw Error('שם הקבוצה כבר תפוס');await enterGroup(code,adminPass,true)}
function leaveGroup(){if(state.listener){state.listener();state.listener=null}state.code=null;state.admin=false;state.players=[];state.movingId=null;closeModal();sessionStorage.removeItem('pokerGroup');sessionStorage.removeItem('pokerPass');$('app').classList.add('hidden');$('lobby').classList.remove('hidden');$('joinPass').value='';msg('')}
// All monetary edits use a database transaction to avoid accidentally overwriting another device's edit.
async function transact(fn){requireAdmin();if(state.processing)throw Error('פעולה אחרת עדיין מתבצעת');state.processing=true;setSync('שומר…');try{const result=await api.runTransaction(state.dbRef,raw=>{if(raw===null)return;const draft={...raw};draft.players=normalizePlayers(raw.players);draft.physicalCash=num(raw.physicalCash);const proceed=fn(draft);if(proceed===false)return;return draft},{applyLocally:false});if(!result.committed)throw Error('השינוי לא נשמר, ייתכן שהנתונים השתנו בינתיים');setSync('נשמר בהצלחה');return result.snapshot.val()}catch(e){setSync('שגיאת שמירה: '+e.message,true);throw e}finally{state.processing=false}}
const apply=async(f)=>{try{await f()}catch(e){console.error(e);alert(e.message||'שגיאה בביצוע הפעולה')}};
function validateName(name){if(!name||name.length>60)throw Error('שם השחקן צריך להכיל 1–60 תווים')}
const uniqueId=()=>Date.now()*1000+Math.floor(Math.random()*1000);
async function sitPlayer(id,name,cards,buyIn,requestedSeat){buyIn=intPositive(buyIn);if(id==null)validateName(name);await transact(d=>{const occupied=seatMap(d.players);let seat=requestedSeat;if(seat===null||seat===undefined||occupied.has(seat))seat=firstEmpty(d.players);if(seat<0)throw Error('כל עשרת הכיסאות תפוסים');let p=id!=null?getPlayer(id,d.players):null;if(id!=null&&(!p||p.active))throw Error('השחקן כבר בשולחן או לא נמצא');if(!p){p={id:uniqueId(),name,cards:cards||'??',lifetime:0,sessionBalance:0,history:[],active:false,currentInv:0,rebuys:0,rebuyLog:[]};d.players.push(p)}Object.assign(p,{active:true,seatIndex:seat,currentInv:buyIn,rebuys:0,rebuyLog:[]})});closeModal()}
async function rebuyPlayer(id,amount){const amt=intPositive(amount);await transact(d=>{const p=getPlayer(id,d.players);if(!p||!p.active)throw Error('השחקן כבר אינו בשולחן');p.currentInv+=amt;p.rebuys+=1;p.rebuyLog.push({amount:amt,timestamp:Date.now()})});closeModal()}
async function cashoutPlayer(id,amount,cash){const amt=intNonNegative(amount),physical=intNonNegative(cash);await transact(d=>{const p=getPlayer(id,d.players);if(!p||!p.active)throw Error('השחקן כבר אינו בשולחן');const inv=p.currentInv,profit=amt-inv;if(physical>Math.abs(profit))throw Error('סכום המזומן גדול מהרווח או מההפסד');p.lifetime+=profit;p.sessionBalance+=profit-(profit>0?physical:profit<0?-physical:0);d.physicalCash+=profit>0?-physical:profit<0?physical:0;p.history.push({date:new Date().toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'}),profit,invested:inv,cashedOut:amt,timestamp:Date.now(),rebuys:p.rebuys,rebuyLog:[...p.rebuyLog],eventId:uniqueId()});Object.assign(p,{active:false,seatIndex:null,currentInv:0,rebuys:0,rebuyLog:[]})});closeModal()}
async function removePlayerFromTable(id){await transact(d=>{const p=getPlayer(id,d.players);if(!p||!p.active)throw Error('השחקן אינו פעיל');Object.assign(p,{active:false,seatIndex:null,currentInv:0,rebuys:0,rebuyLog:[]})});closeModal()}
async function movePlayer(fromId,toSeat){await transact(d=>{const p=getPlayer(fromId,d.players);if(!p||!p.active)throw Error('השחקן אינו בשולחן');const dest=seatMap(d.players).get(toSeat);if(dest&&idOf(dest)!==String(fromId))dest.seatIndex=p.seatIndex;p.seatIndex=toSeat});state.movingId=null;render()}
async function setCards(id,cards){await transact(d=>{const p=getPlayer(id,d.players);if(!p)throw Error('שחקן לא נמצא');p.cards=String(cards||'??').slice(0,20)});closeModal()}
async function setPhysicalCash(value){const v=intNonNegative(value);await transact(d=>{d.physicalCash=v});closeModal()}
async function deletePlayer(id){await transact(d=>{if(!getPlayer(id,d.players))throw Error('השחקן אינו קיים');d.players=d.players.filter(p=>idOf(p)!==String(id))})}
function historyEvents(players){return players.flatMap(p=>(p.history||[]).filter(Boolean).map((h,index)=>({...h,playerId:idOf(p),playerName:p.name,histIndex:index,timestamp:num(h.timestamp)}))).sort((a,b)=>a.timestamp-b.timestamp)}
function buildSessions(players){const events=historyEvents(players);if(!events.length)return [];const groups=[];let arr=[events[0]];for(let i=1;i<events.length;i++){if(events[i].timestamp-events[i-1].timestamp>12*3600*1000){groups.push(arr);arr=[]}arr.push(events[i])}groups.push(arr);return groups.map((items,idx)=>{const people=new Map();for(const e of items){if(!people.has(e.playerId))people.set(e.playerId,{name:e.playerName,id:e.playerId,invested:0,cashedOut:0,profit:0,cashouts:[]});const p=people.get(e.playerId);p.invested+=num(e.invested);p.cashedOut+=num(e.cashedOut);p.profit+=num(e.profit);p.cashouts.push(e)}return{id:idx,startTs:items[0].timestamp,lastTs:items.at(-1).timestamp,players:[...people.values()],events:items,totalPot:[...people.values()].reduce((s,p)=>s+p.invested,0)}}).reverse()}
async function deleteSession(idx){const session=buildSessions(state.players)[idx];if(!session)throw Error('הערב לא נמצא');const keys=new Set(session.events.map(e=>e.playerId+'|'+e.histIndex));await transact(d=>{for(const p of d.players){p.history=p.history.filter((_,i)=>!keys.has(idOf(p)+'|'+i));p.lifetime=p.history.reduce((s,h)=>s+num(h.profit),0)}})}
async function editHistory(id,index,profit,invested,cashedOut){profit=Number(profit);invested=intNonNegative(invested);cashedOut=intNonNegative(cashedOut);if(!Number.isFinite(profit)||!Number.isInteger(profit))throw Error('רווח חייב להיות מספר שלם');await transact(d=>{const p=getPlayer(id,d.players);if(!p||!p.history[index])throw Error('הרשומה לא נמצאה');p.history[index]={...p.history[index],profit,invested,cashedOut};p.lifetime=p.history.reduce((s,h)=>s+num(h.profit),0)})}
async function deleteHistory(id,indexes){await transact(d=>{const p=getPlayer(id,d.players);if(!p)throw Error('שחקן לא נמצא');p.history=p.history.filter((_,i)=>!indexes.includes(i));p.lifetime=p.history.reduce((s,h)=>s+num(h.profit),0)})}
async function editLifetime(id,value){const v=Number(value);if(!Number.isFinite(v)||!Number.isInteger(v))throw Error('יש להזין מספר שלם');await transact(d=>{const p=getPlayer(id,d.players);if(!p)throw Error('שחקן לא נמצא');p.lifetime=v});closeModal()}
function stats(p){const h=(p.history||[]).filter(Boolean).sort((a,b)=>num(a.timestamp)-num(b.timestamp));if(!h.length)return null;const total=h.reduce((s,x)=>s+num(x.invested),0),profits=h.map(x=>num(x.profit)),life=num(p.lifetime),best=h.reduce((a,b)=>num(a.profit)>=num(b.profit)?a:b),worst=h.reduce((a,b)=>num(a.profit)<=num(b.profit)?a:b);const lastWin=profits.at(-1)>=0;let streak=0;for(let i=profits.length-1;i>=0;i--){if((profits[i]>=0)===lastWin)streak++;else break}return{sessions:h.length,roi:total?Math.round(life/total*100):0,avg:Math.round(life/h.length),total,best,worst,streak,lastWin,recent:profits.slice(-8)}}
function render(){if(!state.code)return;updateAdminUI();const active=state.players.filter(p=>p.active),total=active.reduce((s,p)=>s+num(p.currentInv),0);$('centerPot').textContent=money(total);$('centerPlayers').textContent=active.length+'/10 שחקנים';renderSeats();renderLeaderboard();renderSessions()}
function renderSeats(){const occupied=seatMap(state.players),positions=[[50,6],[86,16],[93,38],[93,62],[86,84],[50,94],[14,84],[7,62],[7,38],[14,16]];$('seats').innerHTML=positions.map(([x,y],i)=>{const p=occupied.get(i);return `<button type="button" data-action="seat" data-seat="${i}" class="seat ${p?'occupied':''} ${state.movingId!=null?'moving':''}" style="left:${x}%;top:${y}%"><span class="circle">${p?cardsHtml(p.cards)+(p.rebuys>0?`<span class="rebuy-pill">R×${num(p.rebuys)}</span>`:''):'+'}</span>${p?`<span class="nameplate"><span class="seat-name" title="${esc(p.name)}">${esc(p.name)}</span><span class="seat-inv">${money(p.currentInv)}</span></span>`:`<span class="seat-n">כיסא ${i+1}</span>`}</button>`}).join('');const mover=getPlayer(state.movingId);$('moveBar').innerHTML=mover?`<div class="moving-banner"><span>בחר כיסא יעד עבור ${esc(mover.name)}</span><button class="btn small outline" data-action="cancel-move">ביטול ✕</button></div>`:'';$('waitingCount').textContent='('+state.players.filter(p=>!p.active).length+')';$('waiting').innerHTML=state.players.filter(p=>!p.active).map(p=>`<div class="player-row"><span class="grow"><b>${esc(p.name)}</b><span class="mini-text"> ${cardsHtml(p.cards)}</span></span><button class="btn small outline" data-action="quick-sit" data-id="${esc(idOf(p))}">הושב</button><button class="btn small danger" data-action="delete-player" data-id="${esc(idOf(p))}">🗑</button></div>`).join('')||'<p class="mini-text">אין שחקנים ממתינים</p>'}
function renderLeaderboard(){const sorted=[...state.players].sort((a,b)=>num(b.lifetime)-num(a.lifetime));$('leaderboard').innerHTML=sorted.map((p,i)=>{const st=stats(p),v=num(p.lifetime);return `<div class="lb-card"><div class="lb-head" data-action="toggle-expand"><span class="rank">${['🥇','🥈','🥉'][i]||'#'+(i+1)}</span>${cardsHtml(p.cards)}<div class="grow"><div class="lb-name">${esc(p.name)} ${st?(st.lastWin?'↗':'↘'):''}</div><div class="mini-text">${st?st.sessions+' פדיונות · ממוצע '+signed(st.avg):'אין היסטוריה'}</div></div><span class="profit ${v>=0?'pos':'neg'}">${signed(v)}</span><span class="muted">⌄</span></div><div class="expand hidden">${st?`<div class="statgrid"><div class="stattile"><small>ROI</small><b class="${st.roi>=0?'pos':'neg'}">${st.roi}%</b></div><div class="stattile"><small>פדיונות</small><b>${st.sessions}</b></div><div class="stattile"><small>ממוצע</small><b>${signed(st.avg)}</b></div></div><div class="sub" style="margin:12px 0 5px">סה"כ השקיע: ${money(st.total)} · רצף ${st.lastWin?'ניצחונות':'הפסדים'}: ${st.streak}</div><div class="flex">${st.recent.map(q=>`<span style="color:${q>=0?'var(--green)':'var(--red)'}">●</span>`).join('')}</div><div class="records"><div class="record"><small>🏆 הפדיון הטוב</small><b class="pos">${signed(st.best.profit)}</b><small>${fmtDate(st.best.timestamp)}</small></div><div class="record"><small>💀 הפדיון הגרוע</small><b class="neg">${signed(st.worst.profit)}</b><small>${fmtDate(st.worst.timestamp)}</small></div></div>`:'<div class="muted">אין עדיין נתונים</div>'}<div class="action-row"><button class="btn secondary small" data-action="chart" data-id="${esc(idOf(p))}">📈 גרף</button>${state.admin?`<button class="btn secondary small" data-action="edit-history" data-id="${esc(idOf(p))}">📝 היסטוריה</button><button class="btn outline small" data-action="lifetime" data-id="${esc(idOf(p))}">✏️ יתרה</button><button class="btn outline small" data-action="edit-cards" data-id="${esc(idOf(p))}">🃏 קלפים</button>`:''}</div></div></div>`}).join('')||'<div class="empty">אין שחקנים בקבוצה עדיין 🃏</div>'}
function renderSessions(){const sessions=buildSessions(state.players);$('sessions').innerHTML=sessions.map((s,idx)=>`<div class="session-card"><div class="session-head" data-action="toggle-expand"><div class="grow"><b style="color:var(--gold)">📅 ${fmtDate(s.startTs)}</b><div class="mini-text">${fmtTime(s.startTs)} — ${fmtTime(s.lastTs)} · ${s.players.length} שחקנים</div></div><b style="color:var(--gold);font:900 20px Rubik">${money(s.totalPot)}</b>⌄</div><div class="expand hidden">${s.players.map(p=>`<div class="history-row"><div><b>${esc(p.name)}</b><div class="tiny">השקיע ${money(p.invested)} | פדה ${money(p.cashedOut)}</div><div>${p.cashouts.flatMap(e=>e.rebuyLog||[]).map(r=>`<span class="chip">+${money(r.amount)} ${fmtTime(r.timestamp)}</span>`).join('')||'<span class="tiny">ללא ריביי</span>'}</div></div><b class="profit ${p.profit>=0?'pos':'neg'}">${signed(p.profit)}</b></div>`).join('')}<div class="mini-text">סה״כ קופה: ${money(s.totalPot)}</div>${state.admin?`<button class="btn danger full small" style="margin-top:12px" data-action="delete-session" data-index="${idx}">🗑 מחק ערב זה</button>`:''}</div></div>`).join('')||'<div class="empty">אין ערבים בהיסטוריה עדיין 🃏</div>'}
// Seat picker: client-side instant search among players who are not currently seated.
function normalizePlayerSearch(value){return String(value??'').normalize('NFKC').toLocaleLowerCase('he-IL').replace(/\s+/g,' ').trim()}
function filterSitPlayers(){
 const input=$('sitPlayerSearch'),results=$('sitPlayerResults'),hint=$('sitPlayerSearchStatus');
 if(!input||!results||!hint)return;
 const query=normalizePlayerSearch(input.value);
 const waiting=state.players.filter(p=>!p.active);
 const matching=waiting.filter(p=>normalizePlayerSearch(p.name).includes(query))
   .sort((a,b)=>String(a.name).localeCompare(String(b.name),'he'));
 const visible=matching.slice(0,8);
 results.innerHTML=visible.length?visible.map(p=>`<div class="player-row"><div class="grow"><b>${esc(p.name)}</b>${cardsHtml(p.cards)}</div><button type="button" class="btn small outline" data-action="sit-existing" data-id="${esc(idOf(p))}">הושב ←</button></div>`).join(''):
   `<div class="search-empty">${waiting.length===0?'אין שחקנים פנויים בקבוצה': 'לא נמצאו שחקנים בשם הזה. אפשר להוסיף שחקן חדש למטה.'}</div>`;
 hint.textContent=!waiting.length?'':matching.length>8?`נמצאו ${matching.length} שחקנים · מוצגים 8 הראשונים. הקלד עוד אותיות לצמצום.`:query?`נמצאו ${matching.length} שחקנים`:`${waiting.length} שחקנים זמינים · הקלד שם לחיפוש מהיר`;
}
function openSit(seat){
 requireAdmin();
 if(seat<0){alert('כל עשרת הכיסאות תפוסים');return}
 state.pendingSeat=seat;
 showModal('הושבת שחקן בכיסא #'+(seat+1),`<label class="label">סכום כניסה (Buy-in בש״ח)</label><div class="quick"><button type="button" data-buy="50">₪50</button><button type="button" data-buy="100">₪100</button><button type="button" data-buy="150">₪150</button></div><input class="field" type="number" min="1" step="1" id="sitBuyIn" value="50"><h3 class="heading">בחר שחקן קבוע</h3><input id="sitPlayerSearch" class="field" type="search" placeholder="🔍 חפש לפי שם השחקן..." autocomplete="off" aria-label="חיפוש שחקן קבוע"><div class="search-hint" id="sitPlayerSearchStatus" role="status"></div><div class="sit-search-results" id="sitPlayerResults"></div><div class="sep"></div><h3 class="heading">או הוסף שחקן חדש</h3><div class="flex"><input id="sitNewName" class="field grow" placeholder="שם שחקן"><input id="sitNewCards" class="field" style="width:96px" placeholder="AhKs"></div><button type="button" class="btn full" data-action="sit-new">+ צור והושב</button>`,'sit');
 filterSitPlayers();
 $('sitPlayerSearch').focus();
}
function openSeat(p){state.currentPlayerId=idOf(p);showModal(p.name,`<div class="flex" style="justify-content:center">${cardsHtml(p.cards)}<b class="muted">כיסא #${num(p.seatIndex)+1}</b></div><div class="statgrid" style="margin:15px 0"><div class="stattile"><small>שילם הערב</small><b style="color:var(--gold)">${money(p.currentInv)}</b></div><div class="stattile"><small>ריביי</small><b>×${num(p.rebuys)}</b></div><div class="stattile"><small>מאזן כולל</small><b class="${num(p.lifetime)>=0?'pos':'neg'}">${signed(p.lifetime)}</b></div></div>${state.admin?`<div class="action-row"><button class="btn" data-action="open-rebuy">➕ ריביי</button><button class="btn success" data-action="open-cashout">💰 פדיון</button><button class="btn secondary" data-action="start-move">🔄 הזז כיסא</button><button class="btn secondary" data-action="edit-cards" data-id="${esc(idOf(p))}">🃏 שנה קלפים</button></div><button class="btn danger full" data-action="remove-from-table">❌ הסר מהשולחן (ללא פדיון)</button>`:'<p class="sub">פעולות השולחן זמינות למנהל בלבד.</p>'}`,'seat')}
function openRebuy(p){state.currentPlayerId=idOf(p);showModal('Rebuy – '+p.name,`<p class="sub">${fmtTime(Date.now())}</p><div class="row-buttons"><button class="btn" data-action="rebuy" data-amount="50">+ ₪50</button><button class="btn" data-action="rebuy" data-amount="100">+ ₪100</button></div><div class="flex" style="margin-top:12px"><input type="number" id="customRebuy" class="field grow" min="1" placeholder="סכום אחר"><button class="btn outline" data-action="custom-rebuy">הוסף</button></div>`,'rebuy')}
function openCashout(p){state.currentPlayerId=idOf(p);showModal('פדיון ז׳יטונים – '+p.name,`<p class="sub">השקעה כוללת: ${money(p.currentInv)}</p><label class="label">כמה שווים הז׳יטונים של השחקן (בש״ח)?</label><input class="field" type="number" id="cashoutAmount" min="0" step="1" placeholder="אפשר גם 0"><p id="cashoutResult" style="font-weight:900"></p><label class="label">מזומן פיזי שהוחלף בקופה (אופציונלי)</label><input class="field" type="number" id="cashoutCash" min="0" step="1" value="0"><p class="sub">בהפסד: מזומן שהשחקן הכניס לקופה. ברווח: מזומן שלקח מהקופה. ניתן להזין 0.</p><p class="sub" id="cashRemaining"></p><button class="btn full" data-action="cashout">✓ אשר פדיון ופנה כיסא</button>`,'cashout')}
function openCards(p){showModal('שנה קלפים – '+p.name,`<label class="label">לדוגמה AhKs</label><input id="cardsInput" class="field" value="${esc(p.cards||'??')}" maxlength="20"><button class="btn full" data-action="save-cards" data-id="${esc(idOf(p))}">שמור קלפים</button>`,'cards')}
function openPasswordModal(){showModal('שינוי סיסמאות',`<label class="label">סיסמת מנהל חדשה</label><input class="field" id="adminPasswordInput" type="password" autocomplete="new-password"><label class="label">סיסמת צפייה חדשה</label><input class="field" id="viewPasswordInput" type="password" autocomplete="new-password"><button class="btn full" data-action="save-passwords">שמור סיסמאות</button>`,'passwords')}
function openHistory(p){state.currentPlayerId=idOf(p);const h=p.history||[];showModal('עריכת היסטוריה – '+p.name,`<p class="sub">עריכת רווחים ותוצאות. מחיקה מעדכנת את יתרת השחקן.</p>${h.map((e,i)=>`<div class="card" style="padding:10px"><label class="checkbox-entry"><input type="checkbox" class="history-check" value="${i}"><b style="color:var(--gold)">${fmtDate(e.timestamp)} ${fmtTime(e.timestamp)}</b></label><div class="statgrid" style="margin-top:10px"><div><label class="label">רווח</label><input class="field" type="number" value="${num(e.profit)}" id="hist-profit-${i}"></div><div><label class="label">השקיע</label><input class="field" type="number" value="${num(e.invested)}" id="hist-invested-${i}"></div><div><label class="label">פדה</label><input class="field" type="number" value="${num(e.cashedOut)}" id="hist-cashed-${i}"></div></div><button class="btn small outline full" data-action="save-history" data-index="${i}">שמור רשומה</button></div>`).join('')||'<div class="empty">אין היסטוריה</div>'}${h.length?'<button class="btn danger full" data-action="delete-history-selected">🗑 מחק רשומות מסומנות</button>':''}`,'history')}
function openChart(p){if(!p.history?.length){alert('אין היסטוריה לשחקן');return}showModal('גרף ביצועים – '+p.name,'<div id="chartMount"><canvas id="playerChart"></canvas></div>','chart');if(typeof Chart==='undefined'){$('chartMount').textContent='לא ניתן לטעון את ספריית הגרפים. בדוק חיבור לאינטרנט.';return}const ordered=[...p.history].filter(Boolean).sort((a,b)=>num(a.timestamp)-num(b.timestamp));let sum=0;const points=ordered.map(e=>(sum+=num(e.profit)));state.chart=new Chart($('playerChart'),{type:'line',data:{labels:ordered.map(e=>fmtDate(e.timestamp)),datasets:[{label:'מאזן מצטבר',data:points,borderColor:'#d4af37',backgroundColor:'rgba(212,175,55,.1)',pointBackgroundColor:points.map(v=>v>=0?'#4ade80':'#fb6570'),fill:true,tension:.2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#eeeeee'}}},scales:{x:{ticks:{color:'#9aa9a1'},grid:{display:false}},y:{ticks:{color:'#9aa9a1'},grid:{color:'#FFFFFF15'}}}}})}
function updateCashPreview(){const amtField=$('cashoutAmount'),cashField=$('cashoutCash');if(!amtField||!cashField)return;const p=getPlayer(state.currentPlayerId);if(!p)return;const val=amtField.value===''?null:num(amtField.value),cash=num(cashField.value),res=$('cashoutResult');if(val===null){res.textContent='';$('cashRemaining').textContent='';return}const profit=val-p.currentInv;res.innerHTML=`${profit>0?'רווח נקי':profit<0?'הפסד':'יוצא מאוזן'}: <span class="${profit>=0?'pos':'neg'}">${signed(profit)}</span>`;$('cashRemaining').textContent=profit>0?'נותר לקבל לאחר מזומן: '+money(profit-cash):profit<0?'נותר להסדרה לאחר מזומן: '+money(Math.abs(profit)-cash):'ללא רווח/הפסד'}
function handleBatchFromUrl(){const raw=new URLSearchParams(location.search).get('batch');if(!raw)return;state.batchApplied=true;const entries=raw.split(',').map(item=>{const ix=item.lastIndexOf(':');if(ix===-1)return null;return{name:item.slice(0,ix).trim(),amount:Number(item.slice(ix+1))}}).filter(e=>e&&e.name&&Number.isInteger(e.amount)&&e.amount>=0);if(!entries.length)return;if(!state.admin){alert('נדרשת כניסת מנהל כדי לייבא תוצאות שקילה. ניתן להיכנס כמנהל ולרענן את העמוד.');return}const lines=entries.map(e=>{const matches=state.players.filter(p=>p.active&&p.name.trim().toLowerCase()===e.name.toLowerCase());const found=matches.length===1?matches[0]:null;return{...e,id:found?idOf(found):null}});showModal('⚖️ תוצאות השקילה',lines.map(e=>`<div class="player-row"><b>${esc(e.name)}<small class="mini-text" style="display:block">${e.id?'✓ נמצא':'⚠ אין התאמה חד-משמעית'}</small></b><span style="color:var(--gold)">${money(e.amount)}</span></div>`).join('')+`<h3 style="text-align:center">סה״כ ${money(lines.reduce((s,e)=>s+e.amount,0))}</h3><button class="btn full" data-action="apply-batch">✓ אשר Cashout לכל השחקנים שנמצאו</button>`,'batch');state.batchEntries=lines}
async function applyBatch(){const entries=state.batchEntries||[],used=new Set();if(!entries.some(e=>e.id))throw Error('לא נמצאו שחקנים פעילים');await transact(d=>{for(const e of entries){if(!e.id||used.has(e.id))continue;used.add(e.id);const p=getPlayer(e.id,d.players);if(!p||!p.active)continue;const invested=p.currentInv,profit=e.amount-invested;p.lifetime+=profit;p.sessionBalance+=profit;p.history.push({date:new Date().toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'}),profit,invested,cashedOut:e.amount,timestamp:Date.now(),eventId:uniqueId(),rebuys:p.rebuys,rebuyLog:[...p.rebuyLog]});Object.assign(p,{active:false,seatIndex:null,currentInv:0,rebuys:0,rebuyLog:[]})}});closeModal();history.replaceState({},'',location.pathname);switchTab('sessions')}
// Action handler: no player-supplied text is ever compiled into an onclick attribute.
document.addEventListener('click',e=>{const button=e.target.closest('[data-action], [data-tab], [data-buy]');if(!button)return;if(button.dataset.tab){switchTab(button.dataset.tab);return}if(button.dataset.buy){$('sitBuyIn').value=button.dataset.buy;return}const action=button.dataset.action,id=button.dataset.id,index=Number(button.dataset.index);const run=async()=>{switch(action){
case 'close-modal':closeModal();break;
case 'leave':if(confirm('להחליף קבוצה?'))leaveGroup();break;
case 'login-admin':{const pass=prompt('סיסמת מנהל:');if(pass===null)return;if(pass===state.adminPassword&&pass){state.admin=true;sessionStorage.setItem('pokerPass',pass);render()}else alert('סיסמה שגויה');break}
case 'logout-admin':state.admin=false;state.movingId=null;sessionStorage.setItem('pokerPass',state.viewPassword);render();break;
case 'passwords':requireAdmin();openPasswordModal();break;
case 'save-passwords':{requireAdmin();const ap=$('adminPasswordInput').value,vp=$('viewPasswordInput').value;if(ap.length<3||vp.length<3||ap===vp)throw Error('סיסמאות שונות באורך 3 תווים לפחות');await api.update(state.dbRef,{adminPassword:ap,viewPassword:vp});state.adminPassword=ap;state.viewPassword=vp;sessionStorage.setItem('pokerPass',ap);closeModal();alert('הסיסמאות עודכנו');break}
case 'physical-cash':requireAdmin();showModal('מזומן פיזי בקופה',`<input type="number" class="field" min="0" id="physicalInput" value="${state.physicalCash}"><button class="btn full" data-action="save-physical">שמור</button>`,'physical');break;
case 'save-physical':await setPhysicalCash($('physicalInput').value);break;
case 'seat':{const seat=Number(button.dataset.seat);if(state.movingId!=null){requireAdmin();if(getPlayer(state.movingId)?.seatIndex!==seat)await movePlayer(state.movingId,seat);else{state.movingId=null;render()}}else{const p=seatMap(state.players).get(seat);if(p)openSeat(p);else openSit(seat)}break}
case 'cancel-move':state.movingId=null;render();break;
case 'quick-sit':openSit(firstEmpty(state.players));break;
case 'sit-existing':await sitPlayer(id,null,null,$('sitBuyIn').value,state.pendingSeat);break;
case 'sit-new':await sitPlayer(null,$('sitNewName').value.trim(),$('sitNewCards').value.trim(),$('sitBuyIn').value,state.pendingSeat);break;
case 'open-rebuy':requireAdmin();openRebuy(getPlayer(state.currentPlayerId));break;
case 'rebuy':await rebuyPlayer(state.currentPlayerId,button.dataset.amount);break;
case 'custom-rebuy':await rebuyPlayer(state.currentPlayerId,$('customRebuy').value);break;
case 'open-cashout':requireAdmin();openCashout(getPlayer(state.currentPlayerId));break;
case 'cashout':await cashoutPlayer(state.currentPlayerId,$('cashoutAmount').value,$('cashoutCash').value);break;
case 'start-move':requireAdmin();state.movingId=state.currentPlayerId;closeModal();render();break;
case 'remove-from-table':requireAdmin();if(confirm('להסיר את השחקן ללא היסטוריה או פדיון?'))await removePlayerFromTable(state.currentPlayerId);break;
case 'edit-cards':requireAdmin();openCards(getPlayer(id));break;
case 'save-cards':await setCards(id,$('cardsInput').value);break;
case 'delete-player':requireAdmin();if(confirm('למחוק שחקן לצמיתות וכל ההיסטוריה שלו?'))await deletePlayer(id);break;
case 'toggle-expand':button.parentElement.querySelector('.expand')?.classList.toggle('hidden');break;
case 'chart':openChart(getPlayer(id));break;
case 'edit-history':requireAdmin();openHistory(getPlayer(id));break;
case 'save-history':{requireAdmin();const playerId=state.currentPlayerId;await editHistory(playerId,index,$('hist-profit-'+index).value,$('hist-invested-'+index).value,$('hist-cashed-'+index).value);openHistory(getPlayer(playerId));break}
case 'delete-history-selected':{requireAdmin();const selected=[...document.querySelectorAll('.history-check:checked')].map(e=>Number(e.value));if(!selected.length)throw Error('לא נבחרו רשומות');if(confirm('למחוק '+selected.length+' רשומות?')){const pid=state.currentPlayerId;await deleteHistory(pid,selected);openHistory(getPlayer(pid))}break}
case 'lifetime':{requireAdmin();const p=getPlayer(id);const input=prompt('יתרה מעודכנת – '+p.name,p.lifetime);if(input!==null)await editLifetime(id,input);break}
case 'delete-session':requireAdmin();if(confirm('למחוק את כל הפדיונות של הערב?'))await deleteSession(index);break;
case 'apply-batch':requireAdmin();if(confirm('לאשר פדיון לכל השחקנים שהתאימו?'))await applyBatch();break;
}}
apply(run)});
document.addEventListener('input',e=>{if(e.target.id==='sitPlayerSearch')filterSitPlayers();if(e.target.id==='cashoutAmount'||e.target.id==='cashoutCash')updateCashPreview()});
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='sitPlayerSearch'){const matches=$('sitPlayerResults')?.querySelectorAll('[data-action="sit-existing"]');if(matches?.length===1){e.preventDefault();matches[0].click()}}if(e.key==='Escape'&&!$('modal').classList.contains('hidden'))closeModal()});
$('joinForm').addEventListener('submit',e=>{e.preventDefault();apply(async()=>{msg('מתחבר…');try{await joinGroup(cleanCode($('joinCode').value),$('joinPass').value);msg('')}catch(err){msg(err.message,true);throw err}})});
$('createForm').addEventListener('submit',e=>{e.preventDefault();apply(async()=>{msg('יוצר קבוצה…');try{await createGroup(cleanCode($('newCode').value),$('newAdmin').value,$('newViewer').value);msg('')}catch(err){msg(err.message,true);throw err}})});
async function boot(){try{msg('מתחבר לשירות…');const [{initializeApp},{getDatabase,ref,set,get,update,onValue,runTransaction}]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js')]);api={ref,set,get,update,onValue,runTransaction};db=getDatabase(initializeApp(FIREBASE_CONFIG));state.ready=true;msg('');const code=sessionStorage.getItem('pokerGroup'),pass=sessionStorage.getItem('pokerPass');if(code&&pass){try{await joinGroup(code,pass)}catch(err){console.warn('Saved login rejected:',err.message);sessionStorage.removeItem('pokerGroup');sessionStorage.removeItem('pokerPass');msg('יש להתחבר מחדש: '+err.message,true)}}}catch(err){console.error('Firebase startup error',err);msg('לא ניתן לטעון Firebase. בדוק חיבור לאינטרנט, גישה לקובצי Google והגדרות האתר.\n'+err.message,true)}}
boot();
</script>

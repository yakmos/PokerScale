/* realistic poker table refresh */
.table-wrap{position:relative;height:560px;max-width:430px;margin:18px auto 24px;direction:ltr;user-select:none}
.table-shell{position:absolute;inset:18px 16px 24px;border-radius:48% 48% 44% 44% / 22% 22% 28% 28%;background:linear-gradient(180deg,#202427 0%,#090d11 50%,#1c2124 100%);box-shadow:0 28px 55px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.12),inset 0 -16px 24px rgba(0,0,0,.55);overflow:hidden;pointer-events:none}
.table-shell:before{content:"";position:absolute;inset:18px 16px;border-radius:46% 46% 42% 42% / 21% 21% 28% 28%;background:linear-gradient(180deg,#343a3d 0%,#12171a 100%);box-shadow:inset 0 2px 10px rgba(255,255,255,.08), inset 0 -10px 15px rgba(0,0,0,.6)}
.table-shell:after{content:"";position:absolute;inset:38px 36px;border-radius:44% 44% 40% 40% / 19% 19% 26% 26%;background:linear-gradient(180deg,#283033 0%,#101517 100%);box-shadow:0 0 0 1px rgba(255,255,255,.05), inset 0 0 16px rgba(0,0,0,.65)}
.felt{position:absolute;inset:54px 50px;border-radius:42% 42% 39% 39% / 17% 17% 24% 24%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06), inset 0 0 65px rgba(0,0,0,.28), 0 0 0 1px rgba(255,255,255,.03);background:radial-gradient(circle at 50% 44%,rgba(255,255,255,.08),rgba(255,255,255,0) 35%), radial-gradient(circle at 50% 50%,#3e9a63 0%,#2f7d4d 22%,#21623d 48%,#15452d 72%,#103021 100%);display:grid;place-items:center;overflow:hidden}
.felt:before{content:"";position:absolute;inset:12px;border-radius:40% 40% 37% 37% / 15.5% 15.5% 22% 22%;border:2px solid rgba(224,229,225,.26)}
.felt:after{content:"";position:absolute;inset:0;background:
 radial-gradient(circle at 16% 23%,rgba(17,44,31,.22) 0 9%,transparent 10%),
 radial-gradient(circle at 84% 23%,rgba(17,44,31,.22) 0 9%,transparent 10%),
 radial-gradient(circle at 18% 79%,rgba(17,44,31,.22) 0 11%,transparent 12%),
 radial-gradient(circle at 82% 79%,rgba(17,44,31,.22) 0 11%,transparent 12%),
 linear-gradient(90deg,transparent 48%,rgba(230,235,232,.08) 49%,rgba(230,235,232,.08) 51%,transparent 52%);
 opacity:.95}
.felt-brand{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:72%;display:flex;flex-direction:column;align-items:center;gap:10px;color:rgba(239,242,240,.7);text-align:center;text-shadow:0 1px 0 rgba(0,0,0,.22)}
.brand-line{font:900 20px Rubik,sans-serif;letter-spacing:2px}
.brand-line.top{font-size:18px}.brand-line.bottom{font-size:14px;letter-spacing:1.6px}
.community-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:210px}
.community-row span{display:block;height:42px;border:2px solid rgba(239,242,240,.58);border-radius:7px;background:rgba(255,255,255,.02)}
.table-center{direction:rtl;position:absolute;left:50%;top:72%;transform:translate(-50%,-50%);z-index:2;background:rgba(0,0,0,.5);border:1px solid rgba(212,175,55,.6);border-radius:16px;text-align:center;padding:11px 16px;box-shadow:0 10px 26px rgba(0,0,0,.3);backdrop-filter:blur(4px)}
.table-center small{display:block;font-size:11px;color:#d7e2dc}.table-center strong{font:900 28px Rubik;color:var(--gold);line-height:1.1}
.cupholder{position:absolute;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d1d7dd 0%,#97a0a8 28%,#4b5359 47%,#1d2328 62%,#06080a 100%);box-shadow:inset 0 2px 3px rgba(255,255,255,.28), inset 0 -4px 8px rgba(0,0,0,.75), 0 2px 7px rgba(0,0,0,.45);z-index:1}
.cupholder:after{content:"";position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 45% 35%,#1c2024 0%,#07090b 65%,#000 100%);box-shadow:inset 0 1px 3px rgba(255,255,255,.08)}
.c1{left:12%;top:38%}.c2{left:17%;top:80%}.c3{left:41%;top:90%}.c4{left:67%;top:90%}.c5{left:83%;top:80%}.c6{left:88%;top:38%}.c7{left:33%;top:9%}.c8{left:68%;top:9%}
.rail-inset{position:absolute;width:74px;height:16px;border-radius:10px;background:linear-gradient(180deg,#cfb784,#a8854a 55%,#6e5432 100%);box-shadow:inset 0 1px 1px rgba(255,255,255,.35), inset 0 -2px 3px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.4);z-index:1;opacity:.95}
.i1{left:26%;top:10%}.i2{left:59%;top:10%}.i3{left:82%;top:32%;transform:rotate(90deg)}.i4{left:82%;top:68%;transform:rotate(90deg)}.i5{left:59%;top:88%}.i6{left:26%;top:88%}
.seat{width:84px;min-height:94px;z-index:4}.seat .circle{width:56px;height:56px;border:2px solid rgba(212,175,55,.68);background:radial-gradient(circle at 40% 30%,rgba(255,255,255,.1),rgba(255,255,255,0) 35%),rgba(6,10,12,.96);box-shadow:0 0 0 3px rgba(255,255,255,.05),0 6px 18px rgba(0,0,0,.7)}
.seat.occupied .circle{box-shadow:0 0 0 3px rgba(255,255,255,.05),0 0 20px rgba(212,175,55,.22),0 8px 22px rgba(0,0,0,.75)}
.seat .nameplate{min-width:70px;max-width:95px;border-radius:10px;background:linear-gradient(180deg,#1f2628 0%,#151b1d 100%);border:1px solid rgba(255,255,255,.12);padding:4px 8px;box-shadow:0 6px 14px rgba(0,0,0,.45)}
.seat .seat-name{font-size:11px}.seat .seat-inv{font-size:13px}.seat .seat-n{font-size:11px;color:#d4ddd8}
.hint{max-width:430px;margin:4px auto 12px;line-height:1.5}
@media(max-width:370px){.table-wrap{height:520px;max-width:390px}.table-shell{inset:16px 10px 24px}.felt{inset:48px 42px}.brand-line{font-size:16px}.brand-line.bottom{font-size:12px}.community-row{max-width:180px}.community-row span{height:36px}.table-center{padding:10px 14px}.table-center strong{font-size:24px}.cupholder{width:26px;height:26px}.rail-inset{width:62px}}

.seat .seat-name{font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.seat .seat-inv{font:700 13px Rubik;color:var(--gold);display:block;margin-top:2px}

function buildSessions(players){const events=historyEvents(players);if(!events.length)return [];const groups=[];let arr=[events[0]];for(let i=1;i<events.length;i++){if(events[i].timestamp-events[i-1].timestamp>12*3600*1000){groups.push(arr);arr=[]}arr.push(events[i])}groups.push(arr);return groups.map((items,idx)=>{const people=new Map();for(const e of items){if(!people.has(e.playerId))people.set(e.playerId,{name:e.playerName,id:e.playerId,invested:0,cashedOut:0,profit:0,cashouts:[]});const p=people.get(e.playerId);p.invested+=num(e.invested);p.cashedOut+=num(e.cashedOut);p.profit+=num(e.profit);p.cashouts.push(e)}return{id:idx,startTs:items[0].timestamp,lastTs:items.at(-1).timestamp,players:[...people.values()],events:items,totalPot:[...people.values()].reduce((s,p)=>s+p.invested,0)}}).reverse()}

function normalizePlayerSearch(value){return String(value??'').normalize('NFKC').toLocaleLowerCase('he-IL').replace(/\s+/g,' ').trim()}
function filterSitPlayers(){
 const input=$('sitPlayerSearch'),results=$('sitPlayerResults'),hint=$('sitPlayerSearchStatus');
 if(!input||!results||!hint)return;
 const query=normalizePlayerSearch(input.value);
 const waiting=state.players.filter(p=>!p.active);
 const matching=waiting.filter(p=>normalizePlayerSearch(p.name).includes(query))
   .sort((a,b)=>String(a.name).localeCompare(String(b.name),'he'));
 const visible=matching.slice(0,8);
 results.innerHTML=visible.length?visible.map(p=>`<div class="player-row"><div class="grow"><b>${esc(p.name)}</b>${cardsHtml(p.cards)}</div><button type="button" class="btn small outline" data-action="sit-existing" data-id="${esc(idOf(p))}">הושב ←</button></div>`).join(''):
   `<div class="search-empty">${waiting.length===0?'אין שחקנים פנויים בקבוצה': 'לא נמצאו שחקנים בשם הזה. אפשר להוסיף שחקן חדש למטה.'}</div>`;
 hint.textContent=!waiting.length?'':matching.length>8?`נמצאו ${matching.length} שחקנים · מוצגים 8 הראשונים. הקלד עוד אותיות לצמצום.`:query?`נמצאו ${matching.length} שחקנים`:`${waiting.length} שחקנים זמינים · הקלד שם לחיפוש מהיר`;
}
function openSit(seat){
 requireAdmin();
 if(seat<0){alert('כל עשרת הכיסאות תפוסים');return}
 state.pendingSeat=seat;
 showModal('הושבת שחקן בכיסא #'+(seat+1),`<label class="label">סכום כניסה (Buy-in בש״ח)</label><div class="quick"><button type="button" data-buy="50">₪50</button><button type="button" data-buy="100">₪100</button><button type="button" data-buy="150">₪150</button></div><input class="field" type="number" min="1" step="1" id="sitBuyIn" value="50"><h3 class="heading">בחר שחקן קבוע</h3><input id="sitPlayerSearch" class="field" type="search" placeholder="🔍 חפש לפי שם השחקן..." autocomplete="off" aria-label="חיפוש שחקן קבוע"><div class="search-hint" id="sitPlayerSearchStatus" role="status"></div><div class="sit-search-results" id="sitPlayerResults"></div><div class="sep"></div><h3 class="heading">או הוסף שחקן חדש</h3><div class="flex"><input id="sitNewName" class="field grow" placeholder="שם שחקן"><input id="sitNewCards" class="field" style="width:96px" placeholder="AhKs"></div><button type="button" class="btn full" data-action="sit-new">+ צור והושב</button>`,'sit');
 filterSitPlayers();
 $('sitPlayerSearch').focus();
}
function openSeat(p){state.currentPlayerId=idOf(p);showModal(p.name,`<div class="flex" style="justify-content:center">${cardsHtml(p.cards)}<b class="muted">כיסא #${num(p.seatIndex)+1}</b></div><div class="statgrid" style="margin:15px 0"><div class="stattile"><small>שילם הערב</small><b style="color:var(--gold)">${money(p.currentInv)}</b></div><div class="stattile"><small>ריביי</small><b>×${num(p.rebuys)}</b></div><div class="stattile"><small>מאזן כולל</small><b class="${num(p.lifetime)>=0?'pos':'neg'}">${signed(p.lifetime)}</b></div></div>${state.admin?`<div class="action-row"><button class="btn" data-action="open-rebuy">➕ ריביי</button><button class="btn success" data-action="open-cashout">💰 פדיון</button><button class="btn secondary" data-action="start-move">🔄 הזז כיסא</button><button class="btn secondary" data-action="edit-cards" data-id="${esc(idOf(p))}">🃏 שנה קלפים</button></div><button class="btn danger full" data-action="remove-from-table">❌ הסר מהשולחן (ללא פדיון)</button>`:'<p class="sub">פעולות השולחן זמינות למנהל בלבד.</p>'}`,'seat')}
function openRebuy(p){state.currentPlayerId=idOf(p);showModal('Rebuy – '+p.name,`<p class="sub">${fmtTime(Date.now())}</p><div class="row-buttons"><button class="btn" data-action="rebuy" data-amount="50">+ ₪50</button><button class="btn" data-action="rebuy" data-amount="100">+ ₪100</button></div><div class="flex" style="margin-top:12px"><input type="number" id="customRebuy" class="field grow" min="1" placeholder="סכום אחר"><button class="btn outline" data-action="custom-rebuy">הוסף</button></div>`,'rebuy')}
function openCashout(p){state.currentPlayerId=idOf(p);showModal('פדיון ז׳יטונים – '+p.name,`<p class="sub">השקעה כוללת: ${money(p.currentInv)}</p><label class="label">כמה שווים הז׳יטונים של השחקן (בש״ח)?</label><input class="field" type="number" id="cashoutAmount" min="0" step="1" placeholder="אפשר גם 0"><p id="cashoutResult" style="font-weight:900"></p><label class="label">מזומן פיזי שהוחלף בקופה (אופציונלי)</label><input class="field" type="number" id="cashoutCash" min="0" step="1" value="0"><p class="sub">בהפסד: מזומן שהשחקן הכניס לקופה. ברווח: מזומן שלקח מהקופה. ניתן להזין 0.</p><p class="sub" id="cashRemaining"></p><button class="btn full" data-action="cashout">✓ אשר פדיון ופנה כיסא</button>`,'cashout')}
function openCards(p){showModal('שנה קלפים – '+p.name,`<label class="label">לדוגמה AhKs</label><input id="cardsInput" class="field" value="${esc(p.cards||'??')}" maxlength="20"><button class="btn full" data-action="save-cards" data-id="${esc(idOf(p))}">שמור קלפים</button>`,'cards')}
function openPasswordModal(){showModal('שינוי סיסמאות',`<label class="label">סיסמת מנהל חדשה</label><input class="field" id="adminPasswordInput" type="password" autocomplete="new-password"><label class="label">סיסמת צפייה חדשה</label><input class="field" id="viewPasswordInput" type="password" autocomplete="new-password"><button class="btn full" data-action="save-passwords">שמור סיסמאות</button>`,'passwords')}
function openHistory(p){state.currentPlayerId=idOf(p);const h=p.history||[];showModal('עריכת היסטוריה – '+p.name,`<p class="sub">עריכת רווחים ותוצאות. מחיקה מעדכנת את יתרת השחקן.</p>${h.map((e,i)=>`<div class="card" style="padding:10px"><label class="checkbox-entry"><input type="checkbox" class="history-check" value="${i}"><b style="color:var(--gold)">${fmtDate(e.timestamp)} ${fmtTime(e.timestamp)}</b></label><div class="statgrid" style="margin-top:10px"><div><label class="label">רווח</label><input class="field" type="number" value="${num(e.profit)}" id="hist-profit-${i}"></div><div><label class="label">השקיע</label><input class="field" type="number" value="${num(e.invested)}" id="hist-invested-${i}"></div><div><label class="label">פדה</label><input class="field" type="number" value="${num(e.cashedOut)}" id="hist-cashed-${i}"></div></div><button class="btn small outline full" data-action="save-history" data-index="${i}">שמור רשומה</button></div>`).join('')||'<div class="empty">אין היסטוריה</div>'}${h.length?'<button class="btn danger full" data-action="delete-history-selected">🗑 מחק רשומות מסומנות</button>':''}`,'history')}
function openChart(p){if(!p.history?.length){alert('אין היסטוריה לשחקן');return}showModal('גרף ביצועים – '+p.name,'<div id="chartMount"><canvas id="playerChart"></canvas></div>','chart');if(typeof Chart==='undefined'){$('chartMount').textContent='לא ניתן לטעון את ספריית הגרפים. בדוק חיבור לאינטרנט.';return}const ordered=[...p.history].filter(Boolean).sort((a,b)=>num(a.timestamp)-num(b.timestamp));let sum=0;const points=ordered.map(e=>(sum+=num(e.profit)));state.chart=new Chart($('playerChart'),{type:'line',data:{labels:ordered.map(e=>fmtDate(e.timestamp)),datasets:[{label:'מאזן מצטבר',data:points,borderColor:'#d4af37',backgroundColor:'rgba(212,175,55,.1)',pointBackgroundColor:points.map(v=>v>=0?'#4ade80':'#fb6570'),fill:true,tension:.2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#eeeeee'}}},scales:{x:{ticks:{color:'#9aa9a1'},grid:{display:false}},y:{ticks:{color:'#9aa9a1'},grid:{color:'#FFFFFF15'}}}}})}
function updateCashPreview(){const amtField=$('cashoutAmount'),cashField=$('cashoutCash');if(!amtField||!cashField)return;const p=getPlayer(state.currentPlayerId);if(!p)return;const val=amtField.value===''?null:num(amtField.value),cash=num(cashField.value),res=$('cashoutResult');if(val===null){res.textContent='';$('cashRemaining').textContent='';return}const profit=val-p.currentInv;res.innerHTML=`${profit>0?'רווח נקי':profit<0?'הפסד':'יוצא מאוזן'}: <span class="${profit>=0?'pos':'neg'}">${signed(profit)}</span>`;$('cashRemaining').textContent=profit>0?'נותר לקבל לאחר מזומן: '+money(profit-cash):profit<0?'נותר להסדרה לאחר מזומן: '+money(Math.abs(profit)-cash):'ללא רווח/הפסד'}
function handleBatchFromUrl(){const raw=new URLSearchParams(location.search).get('batch');if(!raw)return;state.batchApplied=true;const entries=raw.split(',').map(item=>{const ix=item.lastIndexOf(':');if(ix===-1)return null;return{name:item.slice(0,ix).trim(),amount:Number(item.slice(ix+1))}}).filter(e=>e&&e.name&&Number.isInteger(e.amount)&&e.amount>=0);if(!entries.length)return;if(!state.admin){alert('נדרשת כניסת מנהל כדי לייבא תוצאות שקילה. ניתן להיכנס כמנהל ולרענן את העמוד.');return}const lines=entries.map(e=>{const matches=state.players.filter(p=>p.active&&p.name.trim().toLowerCase()===e.name.toLowerCase());const found=matches.length===1?matches[0]:null;return{...e,id:found?idOf(found):null}});showModal('⚖️ תוצאות השקילה',lines.map(e=>`<div class="player-row"><b>${esc(e.name)}<small class="mini-text" style="display:block">${e.id?'✓ נמצא':'⚠ אין התאמה חד-משמעית'}</small></b><span style="color:var(--gold)">${money(e.amount)}</span></div>`).join('')+`<h3 style="text-align:center">סה״כ ${money(lines.reduce((s,e)=>s+e.amount,0))}</h3><button class="btn full" data-action="apply-batch">✓ אשר Cashout לכל השחקנים שנמצאו</button>`,'batch');state.batchEntries=lines}
async function applyBatch(){const entries=state.batchEntries||[],used=new Set();if(!entries.some(e=>e.id))throw Error('לא נמצאו שחקנים פעילים');await transact(d=>{for(const e of entries){if(!e.id||used.has(e.id))continue;used.add(e.id);const p=getPlayer(e.id,d.players);if(!p||!p.active)continue;const invested=p.currentInv,profit=e.amount-invested;p.lifetime+=profit;p.sessionBalance+=profit;p.history.push({date:new Date().toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'}),profit,invested,cashedOut:e.amount,timestamp:Date.now(),eventId:uniqueId(),rebuys:p.rebuys,rebuyLog:[...p.rebuyLog]});Object.assign(p,{active:false,seatIndex:null,currentInv:0,rebuys:0,rebuyLog:[]})}});closeModal();history.replaceState({},'',location.pathname);switchTab('sessions')}
// Action handler: no player-supplied text is ever compiled into an onclick attribute.
document.addEventListener('click',e=>{const button=e.target.closest('[data-action], [data-tab], [data-buy]');if(!button)return;if(button.dataset.tab){switchTab(button.dataset.tab);return}if(button.dataset.buy){$('sitBuyIn').value=button.dataset.buy;return}const action=button.dataset.action,id=button.dataset.id,index=Number(button.dataset.index);const run=async()=>{switch(action){
case 'close-modal':closeModal();break;
case 'leave':if(confirm('להחליף קבוצה?'))leaveGroup();break;
case 'login-admin':{const pass=prompt('סיסמת מנהל:');if(pass===null)return;if(pass===state.adminPassword&&pass){state.admin=true;sessionStorage.setItem('pokerPass',pass);render()}else alert('סיסמה שגויה');break}
case 'logout-admin':state.admin=false;state.movingId=null;sessionStorage.setItem('pokerPass',state.viewPassword);render();break;
case 'passwords':requireAdmin();openPasswordModal();break;
case 'save-passwords':{requireAdmin();const ap=$('adminPasswordInput').value,vp=$('viewPasswordInput').value;if(ap.length<3||vp.length<3||ap===vp)throw Error('סיסמאות שונות באורך 3 תווים לפחות');await api.update(state.dbRef,{adminPassword:ap,viewPassword:vp});state.adminPassword=ap;state.viewPassword=vp;sessionStorage.setItem('pokerPass',ap);closeModal();alert('הסיסמאות עודכנו');break}
case 'physical-cash':requireAdmin();showModal('מזומן פיזי בקופה',`<input type="number" class="field" min="0" id="physicalInput" value="${state.physicalCash}"><button class="btn full" data-action="save-physical">שמור</button>`,'physical');break;
case 'save-physical':await setPhysicalCash($('physicalInput').value);break;
case 'seat':{const seat=Number(button.dataset.seat);if(state.movingId!=null){requireAdmin();if(getPlayer(state.movingId)?.seatIndex!==seat)await movePlayer(state.movingId,seat);else{state.movingId=null;render()}}else{const p=seatMap(state.players).get(seat);if(p)openSeat(p);else openSit(seat)}break}
case 'cancel-move':state.movingId=null;render();break;
case 'quick-sit':openSit(firstEmpty(state.players));break;
case 'sit-existing':await sitPlayer(id,null,null,$('sitBuyIn').value,state.pendingSeat);break;
case 'sit-new':await sitPlayer(null,$('sitNewName').value.trim(),$('sitNewCards').value.trim(),$('sitBuyIn').value,state.pendingSeat);break;
case 'open-rebuy':requireAdmin();openRebuy(getPlayer(state.currentPlayerId));break;
case 'rebuy':await rebuyPlayer(state.currentPlayerId,button.dataset.amount);break;
case 'custom-rebuy':await rebuyPlayer(state.currentPlayerId,$('customRebuy').value);break;
case 'open-cashout':requireAdmin();openCashout(getPlayer(state.currentPlayerId));break;
case 'cashout':await cashoutPlayer(state.currentPlayerId,$('cashoutAmount').value,$('cashoutCash').value);break;
case 'start-move':requireAdmin();state.movingId=state.currentPlayerId;closeModal();render();break;
case 'remove-from-table':requireAdmin();if(confirm('להסיר את השחקן ללא היסטוריה או פדיון?'))await removePlayerFromTable(state.currentPlayerId);break;
case 'edit-cards':requireAdmin();openCards(getPlayer(id));break;
case 'save-cards':await setCards(id,$('cardsInput').value);break;
case 'delete-player':requireAdmin();if(confirm('למחוק שחקן לצמיתות וכל ההיסטוריה שלו?'))await deletePlayer(id);break;
case 'toggle-expand':button.parentElement.querySelector('.expand')?.classList.toggle('hidden');break;
case 'chart':openChart(getPlayer(id));break;
case 'edit-history':requireAdmin();openHistory(getPlayer(id));break;
case 'save-history':{requireAdmin();const playerId=state.currentPlayerId;await editHistory(playerId,index,$('hist-profit-'+index).value,$('hist-invested-'+index).value,$('hist-cashed-'+index).value);openHistory(getPlayer(playerId));break}
case 'delete-history-selected':{requireAdmin();const selected=[...document.querySelectorAll('.history-check:checked')].map(e=>Number(e.value));if(!selected.length)throw Error('לא נבחרו רשומות');if(confirm('למחוק '+selected.length+' רשומות?')){const pid=state.currentPlayerId;await deleteHistory(pid,selected);openHistory(getPlayer(pid))}break}
case 'lifetime':{requireAdmin();const p=getPlayer(id);const input=prompt('יתרה מעודכנת – '+p.name,p.lifetime);if(input!==null)await editLifetime(id,input);break}
case 'delete-session':requireAdmin();if(confirm('למחוק את כל הפדיונות של הערב?'))await deleteSession(index);break;
case 'apply-batch':requireAdmin();if(confirm('לאשר פדיון לכל השחקנים שהתאימו?'))await applyBatch();break;
}}
apply(run)});
document.addEventListener('input',e=>{if(e.target.id==='sitPlayerSearch')filterSitPlayers();if(e.target.id==='cashoutAmount'||e.target.id==='cashoutCash')updateCashPreview()});
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='sitPlayerSearch'){const matches=$('sitPlayerResults')?.querySelectorAll('[data-action="sit-existing"]');if(matches?.length===1){e.preventDefault();matches[0].click()}}if(e.key==='Escape'&&!$('modal').classList.contains('hidden'))closeModal()});
$('joinForm').addEventListener('submit',e=>{e.preventDefault();apply(async()=>{msg('מתחבר…');try{await joinGroup(cleanCode($('joinCode').value),$('joinPass').value);msg('')}catch(err){msg(err.message,true);throw err}})});
$('createForm').addEventListener('submit',e=>{e.preventDefault();apply(async()=>{msg('יוצר קבוצה…');try{await createGroup(cleanCode($('newCode').value),$('newAdmin').value,$('newViewer').value);msg('')}catch(err){msg(err.message,true);throw err}})});
async function boot(){try{msg('מתחבר לשירות…');const [{initializeApp},{getDatabase,ref,set,get,update,onValue,runTransaction}]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js')]);api={ref,set,get,update,onValue,runTransaction};db=getDatabase(initializeApp(FIREBASE_CONFIG));state.ready=true;msg('');const code=sessionStorage.getItem('pokerGroup'),pass=sessionStorage.getItem('pokerPass');if(code&&pass){try{await joinGroup(code,pass)}catch(err){console.warn('Saved login rejected:',err.message);sessionStorage.removeItem('pokerGroup');sessionStorage.removeItem('pokerPass');msg('יש להתחבר מחדש: '+err.message,true)}}}catch(err){console.error('Firebase startup error',err);msg('לא ניתן לטעון Firebase. בדוק חיבור לאינטרנט, גישה לקובצי Google והגדרות האתר.\n'+err.message,true)}}
boot();
</script>
